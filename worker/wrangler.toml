name = "eivrad-contact"
main = "src/index.js"
compatibility_date = "2026-09-10"
# workers.dev の公開 URL は作らない。入口は eivrad.com/api/contact だけにする。
workers_dev = false

# 本番ルート。GitHub Pages 側に /api/ は存在しないため衝突しない。
[[routes]]
pattern = "eivrad.com/api/contact*"
zone_name = "eivrad.com"

# IP あたりのレート制限（60秒あたり5件。period は 10 か 60 のみ指定可）。バインディング名は Worker 側の env.RATE_LIMITER。
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# 通知メールの日次上限（UTC の1日あたり。UTC 0時＝JST 9時に戻る）。
# Resend Free の日次100通を Eve Voice のライセンス Worker と分け合う（2026-10-04 決定: フォーム 20 / ライセンス 80）。
# 上限に達したら Resend を呼ばず、フォームに contact@eivrad.com への直接メールを案内する。
# 0 にするとフォームからの送信を止め、全員にメールでの連絡を案内する。数字以外は既定の 20 として扱う。
[vars]
CONTACT_DAILY_MAIL_CAP = "20"

# 日次上限を数える Durable Object（SQLite 版・src/counter.js の ContactMailCounter）。
# KV は API トークンに権限がないため使わない。保存するのは日付（UTC）と件数だけで、氏名・メール・本文・IP は入れない。
# カウンタが無い・壊れた場合は上限なしで送り（fail open。問い合わせを届けることを優先）、Slack に警告する（isolate ごとに10分に1回まで）。
[[durable_objects.bindings]]
name = "CONTACT_COUNTER"
class_name = "ContactMailCounter"

# Durable Object のクラス作成。適用済みの tag は書き換えない。撤去するときは新しい tag で deleted_classes を足す。
# マイグレーションをまたぐ wrangler rollback は Cloudflare に断られる（v1 を入れる最初の配信は rollback で戻せない。README「戻し方」）。
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ContactMailCounter"]

# シークレットはここに書かない。wrangler secret put で投入すること。
#   TURNSTILE_SECRET / RESEND_API_KEY / NOTIFY_TO / SLACK_WEBHOOK

# 実行ログ（Workers Logs）を使わない。問い合わせの本文・メールアドレス・IP を Cloudflare の
# ログに残さない（2026-10-02・ゲッコー天気のポリシーの保存期間に合わせる）。
[observability]
enabled = false
